<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://raw.githubusercontent.com/arnetworkhouse-oss/tic_tac_toe/main/tic-tac-toe.png" type="image/png">
  <title>Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --surface: #0e1523;
      --surface2: #131d2e;
      --border: rgba(99,179,237,0.12);
      --x-color: #63b3ed;
      --x-glow: rgba(99,179,237,0.5);
      --o-color: #f687b3;
      --o-glow: rgba(246,135,179,0.5);
      --accent: #fbd38d;
      --accent-glow: rgba(251,211,141,0.4);
      --text: #e2e8f0;
      --text-dim: #718096;
      --btn-grad: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      --btn-danger: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
      --cell-bg: #111827;
      --cell-hover: #1a2744;
      --radius-card: 20px;
      --radius-cell: 14px;
      --shadow-card: 0 20px 60px rgba(0,0,0,0.7);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(49,130,206,0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(246,135,179,0.08), transparent);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* ── HEADING ── */
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      text-align: center;
      background: linear-gradient(135deg, var(--x-color) 0%, #90cdf4 40%, var(--o-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(99,179,237,0.3));
    }

    /* ── CARDS ── */
    #setup-area, #game-area {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: clamp(20px, 5vw, 32px);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    /* ── SETUP HEADING ── */
    #mode-selection h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: var(--x-color);
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    /* ── INPUT ── */
    .input-group { margin-bottom: 16px; text-align: left; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--x-color);
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: rgba(99,179,237,0.5);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.12);
    }
    input::placeholder { color: var(--text-dim); }

    /* ── BUTTONS ── */
    button {
      background: var(--btn-grad);
      color: #fff;
      border: none;
      padding: 11px 22px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      margin: 6px 4px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(49,130,206,0.45);
      filter: brightness(1.1);
    }
    button:active { transform: translateY(0); }

    /* AI mode buttons */
    #ai-modes button { font-size: 0.82rem; padding: 9px 16px; }

    /* ── PLAYER BAR ── */
    #player-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 0;
    }

    .player-box {
      flex: 1;
      padding: 10px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity 0.3s, box-shadow 0.3s;
    }

    #player-left  { color: var(--x-color); }
    #player-right { color: var(--o-color); }

    #player-left.active  { box-shadow: 0 0 12px var(--x-glow); border-color: rgba(99,179,237,0.35); }
    #player-right.active { box-shadow: 0 0 12px var(--o-glow); border-color: rgba(246,135,179,0.35); }

    /* ── STATUS ── */
    #status {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      min-height: 1.5em;
    }

    /* ── WINNER ── */
    #winner-display {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.3rem, 5vw, 1.9rem);
      font-weight: 900;
      color: var(--accent);
      margin: 18px 0 6px;
      display: none;
      text-align: center;
      text-shadow: 0 0 24px var(--accent-glow);
      animation: pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── BOARD ── */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px auto;
      max-width: 300px;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--cell-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-cell);
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      user-select: none;
    }
    .cell:hover:not(.x):not(.o) {
      background: var(--cell-hover);
      border-color: rgba(99,179,237,0.25);
    }
    .cell.x {
      color: var(--x-color);
      text-shadow: 0 0 14px var(--x-glow);
    }
    .cell.o {
      color: var(--o-color);
      text-shadow: 0 0 14px var(--o-glow);
    }

    /* flash */
    .cell.flash { animation: flashGlow 0.35s ease-out; }
    @keyframes flashGlow {
      0%   { box-shadow: none; transform: scale(1); }
      40%  { box-shadow: 0 0 28px var(--x-glow); transform: scale(1.06); }
      100% { box-shadow: none; transform: scale(1); }
    }

    /* win */
    .cell.win {
      background: linear-gradient(135deg, #b7791f, var(--accent), #f6e05e);
      color: #1a0a00;
      text-shadow: none;
      border-color: var(--accent);
      box-shadow: 0 0 28px var(--accent-glow), 0 0 60px rgba(251,211,141,0.3);
      animation: winPulse 1.2s infinite ease-in-out;
      transform: scale(1.07);
    }
    @keyframes winPulse {
      0%,100% { box-shadow: 0 0 20px var(--accent-glow); }
      50%      { box-shadow: 0 0 50px rgba(251,211,141,0.7); }
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* ── RESET BTN ── */
    #reset {
      background: var(--btn-danger);
    }
    #reset:hover {
      box-shadow: 0 6px 20px rgba(229,62,62,0.4);
    }

    /* ── LOADER ── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px 28px;
      border-radius: var(--radius-card);
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .loader-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--x-color);
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .progress-box {
      width: 100%;
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--x-color), var(--o-color), var(--accent));
      background-size: 200%;
      animation: shimmer 1.5s linear infinite;
      transition: width 0.08s linear;
      border-radius: 99px;
    }
    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    #progress-text {
      margin-top: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.1em;
    }

    .brand {
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ── FOOTER ── */
    .global-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .global-footer a {
      color: var(--x-color);
      text-decoration: none;
      border-bottom: 1px solid rgba(99,179,237,0.3);
      transition: color 0.2s, border-color 0.2s;
    }
    .global-footer a:hover {
      color: #90cdf4;
      border-color: rgba(144,205,244,0.6);
    }

    /* ── MOBILE ── */
    @media (max-width: 400px) {
      h1 { margin-bottom: 16px; }
      #board { max-width: 280px; gap: 8px; }
      button { padding: 10px 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
    <div id="loader">
  <div class="loader-card">
    <h2>Loading Game</h2>
    <div class="progress-box">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">0%</div>
    <p class="brand">Made by AR Network House</p>
  </div>
</div>


  <h1>Tic-Tac-Toe</h1>

  <div id="setup-area">
    <div id="mode-selection">
      <h2 style="color: var(--x-color);">Choose Mode</h2>
      <div id="ai-modes" style="display:none;">
  <button onclick="selectAI('aran')">ARAN (EXPERT)</button>
  <button onclick="selectAI('void')">VOID (CASUAL)</button>
  <button onclick="selectAI('torpid')">TORPID (BEGINNER)</button>

</div>

      <button onclick="showAIModes()">Play AI</button>
      <button onclick="showNameInputs('multi')">2 Players (Duo)</button>
    </div>

    <div id="name-inputs" style="display:none; margin-top: 20px;">
      <div class="input-group" id="p1-group">
        <label id="p1-label">Player 1 Name:</label>
        <input type="text" id="p1-name" placeholder="Write your name...">
      </div>
      <div class="input-group" id="p2-group">
        <label>Player 2 Name:</label>
        <input type="text" id="p2-name" placeholder="Write your name...">
      </div>
      <button onclick="startGame()">Start Game!</button>
    </div>
  </div>

  <div id="winner-display"></div>

  <div id="game-area" style="display:none;">
    <div id="status">Player X's turn</div>
    <div id="player-bar">
  <div id="player-left" class="player-box"></div>
  <div id="player-right" class="player-box"></div>
</div>

    <div id="board"></div>
    <button onclick="playAgain()">Play Again</button>
    <button id="reset" onclick="resetToHome()">Home</button>
  </div>

  <script>
    const setupArea = document.getElementById('setup-area');
    const loader = document.getElementById('loader');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');

let progress = 0;
let loaderInterval = setInterval(() => {
  progress++;
  progressBar.style.width = progress + "%";
  progressText.textContent = progress + "%";

  if (progress >= 100) {
    clearInterval(loaderInterval);
    setTimeout(() => {
      loader.style.display = 'none';
    }, 300);
  }
}, 50); 

    const nameInputs = document.getElementById('name-inputs');
    const gameArea = document.getElementById('game-area');
    const boardElement = document.getElementById('board');
    const status = document.getElementById('status');
    const winnerDisplay = document.getElementById('winner-display');

    let currentPlayer = 'X';
    let cells = Array(9).fill(null);
    let gameOver = false;
    let gameMode = ''; 
    let aiLevel = 'aran'; 
    let player1 = "Player 1";
    let player2 = "ARAN";

    const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function getWinningPattern(boardState) {
  for (let pattern of winPatterns) {
    const [a, b, c] = pattern;
    if (
      boardState[a] &&
      boardState[a] === boardState[b] &&
      boardState[a] === boardState[c]
    ) {
      return pattern;
    }
  }
  return null;
}

   function showAIModes() {
  const modeSelection = document.getElementById('mode-selection');
  document.getElementById('ai-modes').style.display = 'block';
  modeSelection.children[2].style.display = 'none';
  modeSelection.children[3].style.display = 'none';
}


function selectAI(level) {
  aiLevel = level;
  showNameInputs('single');
}

    function showNameInputs(mode) {
      gameMode = mode;
      document.getElementById('mode-selection').style.display = 'none';
      nameInputs.style.display = 'block';
      
      if (mode === 'single') {
        document.getElementById('p2-group').style.display = 'none';
        document.getElementById('p1-label').textContent = "Give Your Name:";
      } else {
        document.getElementById('p2-group').style.display = 'block';
        document.getElementById('p1-label').textContent = "Player 1 Name:";
      }
    }

    function startGame() {
      const p1 = document.getElementById('p1-name').value.trim();
      const p2 = document.getElementById('p2-name').value.trim();
      
      player1 = p1 || "Player 1";
      if (gameMode === 'single') {
  if (aiLevel === 'aran') player2 = "ARAN";
  else if (aiLevel === 'void') player2 = "VOID";
  else player2 = "TORPID";
} else {
  player2 = p2 || "Player 2";
}


      setupArea.style.display = 'none';
      gameArea.style.display = 'block';
      document.getElementById('player-left').textContent = player1;
      document.getElementById('player-right').textContent = player2;
      resetGame();
    }

    function checkWinner(boardState) {
      for (let pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) return boardState[a];
      }
      return boardState.includes(null) ? null : 'Draw';
    }

    function updatePlayerBar() {
      const leftBox = document.getElementById('player-left');
      const rightBox = document.getElementById('player-right');
      if (currentPlayer === 'X') {
        leftBox.classList.add('active');
        rightBox.classList.remove('active');
        leftBox.style.opacity = '1';
        rightBox.style.opacity = '0.45';
      } else {
        rightBox.classList.add('active');
        leftBox.classList.remove('active');
        rightBox.style.opacity = '1';
        leftBox.style.opacity = '0.45';
      }
    }

    function handleClick(index) {
  if (cells[index] || gameOver) return;

  cells[index] = currentPlayer;
  render();

  const cellDiv = boardElement.children[index];
  if (cellDiv) {
    cellDiv.classList.add('flash');
    setTimeout(() => cellDiv.classList.remove('flash'), 350);
  }

  let result = checkWinner(cells);
  if (result) {
    endGame(result);
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    let nextName = currentPlayer === 'X' ? player1 : player2;
    status.textContent = `${nextName}'s turn (${currentPlayer})`;
    updatePlayerBar();

    if (gameMode === 'single' && currentPlayer === 'O' && !gameOver) {
      setTimeout(() => {
        if (aiLevel === 'aran') aiMove();
        else if (aiLevel === 'void') voidAIMove();
        else torpidAIMove();
      }, 600);
    }
  }
}


function aiMove() {

  let emptyCells = cells
    .map((v, i) => v === null ? i : null)
    .filter(v => v !== null);

  for (let i of emptyCells) {
    cells[i] = 'O';
    if (checkWinner(cells) === 'O') {
      cells[i] = null;
      handleClick(i);
      return;
    }
    cells[i] = null;
  }

  for (let i of emptyCells) {
    cells[i] = 'X';
    if (checkWinner(cells) === 'X') {
      cells[i] = null;
      handleClick(i);
      return;
    }
    cells[i] = null;
  }

  if (cells[4] === null) {
    handleClick(4);
    return;
  }

  const corners = [0, 2, 6, 8].filter(i => cells[i] === null);
  if (corners.length) {
    handleClick(corners[Math.floor(Math.random() * corners.length)]);
    return;
  }

  let bestScore = -Infinity;
  let move;

  for (let i of emptyCells) {
    cells[i] = 'O';
    let score = minimax(cells, 0, -Infinity, Infinity, false);
    cells[i] = null;

    if (score > bestScore) {
      bestScore = score;
      move = i;
    }
  }

  handleClick(move);
}


function voidAIMove() {
  let emptyCells = cells
    .map((v, i) => v === null ? i : null)
    .filter(v => v !== null);

  if (Math.random() < 0.4) {
    handleClick(emptyCells[Math.floor(Math.random() * emptyCells.length)]);
    return;
  }

  let bestScore = -Infinity;
  let move;

  for (let i of emptyCells) {
    cells[i] = 'O';
    let score = minimax(cells, 0, -5, 5, false);
    cells[i] = null;

    if (score > bestScore) {
      bestScore = score;
      move = i;
    }
  }

  handleClick(move ?? emptyCells[0]);
}
function torpidAIMove() {
  let emptyCells = cells
    .map((v, i) => v === null ? i : null)
    .filter(v => v !== null);

  let randomMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
  handleClick(randomMove);
}


function minimax(boardState, depth, alpha, beta, isMaximizing) {
  let result = checkWinner(boardState);

  if (result === 'O') return 10 - depth;
  if (result === 'X') return depth - 10;
  if (result === 'Draw') return 0;

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (boardState[i] === null) {
        boardState[i] = 'O';
        let eval = minimax(boardState, depth + 1, alpha, beta, false);
        boardState[i] = null;
        maxEval = Math.max(maxEval, eval);
        alpha = Math.max(alpha, eval);
        if (beta <= alpha) break;
      }
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (let i = 0; i < 9; i++) {
      if (boardState[i] === null) {
        boardState[i] = 'X';
        let eval = minimax(boardState, depth + 1, alpha, beta, true);
        boardState[i] = null;
        minEval = Math.min(minEval, eval);
        beta = Math.min(beta, eval);
        if (beta <= alpha) break;
      }
    }
    return minEval;
  }
}

    function endGame(winner) {
const winPattern = getWinningPattern(cells);
if (winPattern) {
  winPattern.forEach(i => {
    const cellDiv = boardElement.children[i];
    if (cellDiv) {
      cellDiv.classList.remove('flash');
      cellDiv.classList.add('win');
    }
  });
}

      gameOver = true;
      winnerDisplay.style.display = 'block';
      if (winner === 'Draw') {
        winnerDisplay.textContent = "It's a Draw! 🤝";
      } else {
        let winnerName = (winner === 'X') ? player1 : player2;
        winnerDisplay.textContent = `🎉 ${winnerName} Wins! 🎉`;
      }
      status.textContent = "Game Over!";
    }

    function render() {
      boardElement.innerHTML = '';
      cells.forEach((cell, i) => {
        const div = document.createElement('div');
        div.className = `cell ${cell ? cell.toLowerCase() : ''}`;
        div.textContent = cell;
        div.addEventListener('click', () => handleClick(i));
        boardElement.appendChild(div);
      });
    }

    function resetGame() {
      cells = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      winnerDisplay.style.display = 'none';
      status.textContent = `${player1}'s turn (X)`;
      document.querySelectorAll('.cell').forEach(c => {
  c.classList.remove('win', 'flash');
});
      updatePlayerBar();
      render();
    }
    function playAgain() {
      cells = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      winnerDisplay.style.display = 'none';
      status.textContent = `${player1}'s turn (X)`;
      updatePlayerBar();
      render();
}

    function resetToHome() {
  gameArea.style.display = 'none';
  winnerDisplay.style.display = 'none';
  setupArea.style.display = 'block';
  document.getElementById('mode-selection').style.display = 'block';
  document.getElementById('ai-modes').style.display = 'none';
const modeSelection = document.getElementById('mode-selection');
modeSelection.children[2].style.display = 'inline-block';
modeSelection.children[3].style.display = 'inline-block';
  nameInputs.style.display = 'none';
  document.getElementById('p2-group').style.display = 'block';
  document.getElementById('p1-label').textContent = 'Player 1 Name:';
  document.getElementById('p1-name').value = '';
  document.getElementById('p2-name').value = '';
  gameMode = '';
  aiLevel = 'aran';
  player1 = 'Player 1';
  player2 = 'ARAN';
}
